name: Tests And Allure Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      cucumber_tag:
        description: "Tag do Cucumber para filtrar a execucao"
        required: false
        default: "@E2E"
      browser:
        description: "Browser da execucao"
        required: false
        default: "chrome"
        type: choice
        options:
          - chrome
          - edge
      parallel_count:
        description: "Quantidade de threads para o DataProvider"
        required: false
        default: "2"
      execution_mode:
        description: "Modo de execucao do workflow: github-hosted-docker-gui (Docker com display virtual) ou self-hosted-windows-gui (Windows com sessao grafica ativa)"
        required: false
        default: "github-hosted-docker-gui"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests-github-hosted:
    if: github.event_name == 'push' || github.event.inputs.execution_mode == 'github-hosted-docker-gui'
    runs-on: ubuntu-latest
    env:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare output directories
        run: mkdir -p target logs

      - name: Prepare Docker Compose env file
        run: |
          cat > .env <<EOF
          BROWSER=${{ github.event.inputs.browser || 'chrome' }}
          SELENIUM_IMAGE=selenium/standalone-${{ github.event.inputs.browser || 'chrome' }}
          CUCUMBER_TAG=${{ github.event.inputs.cucumber_tag || '@E2E' }}
          PARALLEL_COUNT=${{ github.event.inputs.parallel_count || '1' }}
          HEADLESS=false
          EOF

      - name: Run automated tests in Docker GUI stack
        run: docker compose up --build --abort-on-container-exit --exit-code-from automacao-gui

      - name: Stop Docker GUI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/*.log
          if-no-files-found: warn

  tests-self-hosted:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.execution_mode == 'self-hosted-windows-gui'
    runs-on:
      - self-hosted
      - windows
      - win10-gui
    env:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run automated tests with Windows GUI session
        run: >
          mvn clean test
          -DLOG_LEVEL=INFO
          -Dcucumber.filter.tags=${{ github.event.inputs.cucumber_tag || '@AGI' }}
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Ddataproviderthreadcount=${{ github.event.inputs.parallel_count || '2' }}
          -Dscreen.width=${env:SCREEN_WIDTH}
          -Dscreen.height=${env:SCREEN_HEIGHT}
          -Dheadless=false
          -Dmaven.clean.failOnError=false

      - name: Session requirements
        shell: powershell
        run: |
          Write-Host "Este job exige runner self-hosted Windows com sessao grafica interativa ativa."
          Write-Host "Contêiner Windows 10 com desktop interativo nao e suportado em GitHub-hosted runners."

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/*.log
          if-no-files-found: warn

  deploy-pages:
    if: always()
    needs:
      - tests-github-hosted
      - tests-self-hosted
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        run: npm install -g allure-commandline --no-audit --no-fund

      - name: Generate Allure report
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Generate JavaDoc
        run: mvn -DskipTests javadoc:javadoc

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p target/pages/reports
          mkdir -p target/pages/javadoc
          cp README.md target/pages/README.md
          cp -R target/allure-report/. target/pages/reports/
          JAVADOC_DIR=""
          if [ -d "target/apidocs" ]; then
            JAVADOC_DIR="target/apidocs"
          elif [ -d "target/site/apidocs" ]; then
            JAVADOC_DIR="target/site/apidocs"
          fi
          if [ -n "$JAVADOC_DIR" ]; then
            cp -R "$JAVADOC_DIR"/. target/pages/javadoc/
          else
            echo "JavaDoc directory not found. Skipping JavaDoc copy."
          fi
          cat <<'EOF' > target/pages/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=https://thiagosantana99.github.io/demo_automacao1.1/README.md">
              <title>Redirecting...</title>
          </head>
          <body>
              <p>Redirecionando para o README do projeto...</p>
              <p><a href="https://thiagosantana99.github.io/demo_automacao1.1/README.md">Abrir README</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
